<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MiDinero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<title>MiDinero</title>
</head>
<body>
<div class="app">
<header class="top">
  <div><span class="eyebrow">CONTROL PERSONAL</span><h1>MiDinero</h1></div>
  <button id="themeBtn" class="iconbtn" aria-label="Cambiar tema">☾</button>
</header>

<main>
<section class="hero card">
  <span>Saldo total</span>
  <strong id="balance">0,00 €</strong>
  <div class="stats">
    <div><small>Ingresos</small><b id="income">0,00 €</b></div>
    <div><small>Gastos</small><b id="expense">0,00 €</b></div>
  </div>
</section>

<div class="actions">
  <button class="primary" id="addIncome">＋ Ingreso</button>
  <button class="danger" id="addExpense">− Gasto</button>
</div>

<section class="card">
  <div class="sectionhead"><h2>Este mes</h2><span id="monthBalance">0,00 €</span></div>
  <div class="bar"><i id="incomeBar"></i><i id="expenseBar"></i></div>
</section>

<section>
  <div class="sectionhead"><h2>Movimientos</h2><button class="textbtn" id="exportBtn">Exportar</button></div>
  <div class="filters">
    <input id="search" placeholder="Buscar movimiento…">
    <select id="filter"><option value="all">Todos</option><option value="income">Ingresos</option><option value="expense">Gastos</option></select>
  </div>
  <div id="list"></div>
</section>
</main>
</div>

<div class="sheet hidden" id="sheet">
  <div class="backdrop" id="closeSheet"></div>
  <form class="modal card" id="form">
    <div class="modalhead"><h2 id="formTitle">Nuevo movimiento</h2><button type="button" class="iconbtn" id="x">×</button></div>
    <div class="seg"><button type="button" data-type="income">Ingreso</button><button type="button" data-type="expense">Gasto</button></div>
    <label>Importe<input id="amount" inputmode="decimal" type="number" step="0.01" min="0.01" required placeholder="0,00"></label>
    <label>Concepto<input id="concept" maxlength="80" required placeholder="Ej. Cena, trabajo web…"></label>
    <label>Categoría<select id="category"></select></label>
    <label>Método<select id="method"><option>Banco</option><option>Tarjeta</option><option>Efectivo</option><option>Bizum</option><option>Otro</option></select></label>
    <label>Fecha<input id="date" type="datetime-local" required></label>
    <button class="save" type="submit">Guardar movimiento</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
